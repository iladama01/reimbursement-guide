<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Claim Hub</title>
  <style>
    :root {
      --bg-main: #FFFDF7;
      --text-dark: #2B2625;
      --color-hero: #D8E6FA;
      --color-purple: #D5C2DF;
      --color-mustard: #DDA336;
      --color-orange: #EE5B2B;
      --color-blue: #D6ECFA;
      --color-cream: #F5EAB8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .logo span {
      color: var(--color-orange);
    }

    .system-btn {
      text-decoration: none;
      background: var(--text-dark);
      color: #FFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .system-btn:hover {
      opacity: 0.85;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .bento-card {
      position: relative;
      border-radius: 24px;
      padding: 24px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-dark);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .bento-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.06);
    }

    .plus-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .card-icon {
      font-size: 36px;
      margin-top: 10px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
    }

    .card-hero {
      background-color: var(--color-hero);
      grid-row: span 2;
    }

    .card-purple { background-color: var(--color-purple); }
    .card-mustard { background-color: var(--color-mustard); color: #FFF; }
    .card-orange { background-color: var(--color-orange); color: #FFF; }
    .card-orange-alt { background-color: var(--color-orange); color: #FFF; }
    .card-blue { background-color: var(--color-blue); }
    .card-cream { background-color: var(--color-cream); }

    @media (max-width: 768px) {
      .bento-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .card-hero {
        grid-row: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="brand-header">
      <div class="logo">EXPENSE HUB <span>+</span></div>
      <a href="#" class="system-btn">BE360 Portal ↗</a>
    </header>

    <main class="bento-grid">

      <a href="index.html" class="bento-card card-hero">
        <span class="plus-icon">+</span>
        <div class="card-icon">📌</div>
        <div class="card-title">How to<br>Submit</div>
      </a>

      <a href="#" class="bento-card card-purple">
        <span class="plus-icon">+</span>
        <div class="card-icon">🏥</div>
        <div class="card-title">Medical Expenses</div>
      </a>

      <a href="#" class="bento-card card-mustard">
        <span class="plus-icon">+</span>
        <div class="card-icon">🤝</div>
        <div class="card-title">Co-pay Claims</div>
      </a>

      <a href="#" class="bento-card card-orange">
        <span class="plus-icon">+</span>
        <div class="card-icon">💼</div>
        <div class="card-title">Project & Sales</div>
      </a>

      <a href="#" class="bento-card card-orange-alt">
        <span class="plus-icon">+</span>
        <div class="card-icon">✈️</div>
        <div class="card-title">Travel Form</div>
      </a>

      <a href="#" class="bento-card card-blue">
        <span class="plus-icon">+</span>
        <div class="card-icon">❓</div>
        <div class="card-title">Q & A</div>
      </a>

      <a href="#" class="bento-card card-cream">
        <span class="plus-icon">+</span>
        <div class="card-icon">📋</div>
        <div class="card-title">Policies</div>
      </a>

    </main>
  </div>

</body>
</html>
